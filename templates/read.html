<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>LawDesk Reader</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
                background: #efefef;
                color: #1a1a1a;
                font-size: 15px;
            }
            a {
                color: inherit;
                text-decoration: none;
            }
            .bar {
                position: sticky;
                top: 0;
                z-index: 10;
                height: 52px;
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 0 14px;
                background: #fff;
                border-bottom: 1px solid #e5e5e5;
            }
            .back {
                font-size: 18px;
                color: #333;
                padding: 6px 10px;
                border-radius: 6px;
            }
            .back:hover {
                background: #f2f2f2;
            }
            .bar-title {
                flex: 1;
                min-width: 0;
                font-size: 13px;
                color: #666;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .bar-status {
                font-size: 11px;
                color: #888;
                background: #f4f4f4;
                padding: 3px 8px;
                border-radius: 999px;
            }
            .wrap {
                max-width: 800px;
                margin: 22px auto;
                padding: 0 14px 90px;
            }
            .sheet {
                background: #fff;
                border-radius: 4px;
                box-shadow: 0 2px 14px rgba(0, 0, 0, 0.06);
                padding: 54px 64px 68px;
                font-family: Georgia, "Times New Roman", serif;
                font-size: 16px;
                line-height: 1.8;
            }
            .loading,
            .error {
                text-align: center;
                padding: 60px 20px;
                color: #888;
                font-size: 14px;
                font-family: -apple-system, sans-serif;
            }
            .spinner {
                display: inline-block;
                width: 18px;
                height: 18px;
                border: 2px solid #e0e0e0;
                border-top-color: #666;
                border-radius: 50%;
                animation: spin 0.7s linear infinite;
                vertical-align: middle;
                margin-right: 8px;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            /* CASE CAPTION */
            .caption {
                text-align: center;
                margin-bottom: 22px;
            }
            .republic {
                font-size: 14px;
                font-weight: 700;
                letter-spacing: 0.2em;
                text-transform: uppercase;
                margin-bottom: 18px;
                color: #111;
            }
            .court {
                font-size: 15px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.07em;
                line-height: 1.5;
                color: #111;
            }
            .division {
                font-size: 12.5px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.12em;
                color: #333;
                margin-top: 4px;
            }
            .case-no {
                font-size: 14px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                margin: 12px 0;
                color: #111;
            }
            .coram {
                font-style: italic;
                font-size: 13px;
                color: #333;
                margin: 10px 0;
            }
            .judge {
                font-size: 14px;
                font-weight: 600;
                color: #111;
                margin: 4px 0;
            }
            .date {
                font-size: 13px;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: #222;
                margin: 4px 0;
            }

            /* CASE PARTIES */
            .parties {
                margin: 22px 0;
            }
            .prow {
                display: flex;
                align-items: baseline;
                gap: 8px;
                font-size: 14px;
                margin: 8px 0;
            }
            .pname {
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.02em;
                color: #111;
                max-width: 76%;
                line-height: 1.5;
            }
            .leader {
                flex: 1 1 auto;
                border-bottom: 1px dotted #999;
                height: 0.9em;
                position: relative;
                top: -3px;
                min-width: 24px;
            }
            .prole {
                font-weight: 700;
                text-transform: uppercase;
                font-size: 13px;
                letter-spacing: 0.04em;
                color: #111;
                flex-shrink: 0;
            }
            .divider {
                text-align: center;
                font-weight: 700;
                font-style: italic;
                letter-spacing: 0.22em;
                font-size: 13px;
                color: #666;
                margin: 18px 0;
            }
            .matter-of {
                text-align: center;
                font-size: 13px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                color: #222;
                margin: 16px 0;
                line-height: 1.5;
            }
            .paren {
                text-align: center;
                font-style: italic;
                font-size: 12.5px;
                color: #444;
                max-width: 660px;
                margin: 18px auto;
                line-height: 1.65;
                padding: 0 22px;
            }
            .doctype {
                text-align: center;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.2em;
                font-size: 16px;
                color: #111;
                margin: 30px 0 26px;
                padding-top: 20px;
                border-top: 1px solid #eee;
            }

            /* CASE BODY */
            .body-heading {
                font-size: 15px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.07em;
                color: #111;
                margin: 30px 0 14px;
                padding-bottom: 6px;
                border-bottom: 1px solid #eee;
            }
            .para {
                display: flex;
                gap: 12px;
                margin-bottom: 16px;
                text-align: justify;
                line-height: 1.8;
            }
            .pnum {
                flex: 0 0 40px;
                font-weight: 700;
                color: #111;
                text-align: right;
                padding-right: 4px;
                font-variant-numeric: tabular-nums;
            }
            .ptext {
                flex: 1;
                min-width: 0;
            }
            .subitem {
                display: flex;
                gap: 8px;
                margin: 8px 0;
                text-align: justify;
                line-height: 1.75;
            }
            .subitem.l1 {
                margin-left: 34px;
            }
            .subitem.l2 {
                margin-left: 60px;
            }
            .subitem.l3 {
                margin-left: 86px;
            }
            .smk {
                flex: 0 0 40px;
                font-weight: 600;
                color: #222;
            }
            .stx {
                flex: 1;
                min-width: 0;
            }
            .quote {
                margin: 16px 0 16px 46px;
                padding: 14px 22px;
                border-left: 3px solid #b0b0b0;
                background: #fafafa;
                font-style: italic;
                color: #333;
                font-size: 15px;
                line-height: 1.75;
                border-radius: 0 4px 4px 0;
            }
            .plain {
                margin-bottom: 16px;
                text-align: justify;
                line-height: 1.8;
            }

            /* CASE SIGNING */
            .signing {
                margin-top: 50px;
                padding-top: 26px;
                border-top: 1px solid #eee;
                text-align: center;
            }
            .sign-date {
                font-size: 13.5px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: #111;
                margin-bottom: 26px;
                line-height: 1.7;
            }
            .sign-name {
                font-size: 14px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                color: #111;
                margin-top: 22px;
            }
            .sign-title {
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: 0.14em;
                color: #444;
                margin-top: 4px;
            }
            .appear-title {
                margin-top: 32px;
                font-size: 13px;
                font-style: italic;
                color: #333;
            }
            .appear-list {
                margin-top: 10px;
                font-size: 13px;
                line-height: 1.8;
            }
            .appear {
                margin: 3px 0;
            }
            .aname {
                font-weight: 500;
                color: #222;
            }
            .arole {
                color: #666;
                font-style: italic;
            }
            .signing.raw {
                white-space: pre-wrap;
                text-align: center;
                font-size: 14px;
                line-height: 1.9;
            }

            /* STATUTE TOC */
            .toc-panel {
                background: #fbfbfb;
                border: 1px solid #ececec;
                border-radius: 8px;
                padding: 20px 24px;
                margin-bottom: 34px;
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
            }
            .toc-title {
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.16em;
                text-transform: uppercase;
                color: #888;
                margin-bottom: 14px;
            }
            .toc-part {
                margin-bottom: 16px;
            }
            .toc-part:last-child {
                margin-bottom: 0;
            }
            .toc-part-label {
                font-size: 11px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.1em;
                color: #222;
                margin-bottom: 6px;
                padding-bottom: 4px;
                border-bottom: 1px solid #eee;
            }
            .toc-secs {
                display: flex;
                flex-direction: column;
                gap: 1px;
            }
            .toc-sec {
                display: flex;
                gap: 10px;
                padding: 6px 8px;
                font-size: 13.5px;
                color: #333;
                border-radius: 4px;
                line-height: 1.5;
                transition: background 0.12s;
            }
            .toc-sec:hover {
                background: #f0f0f0;
            }
            .toc-n {
                min-width: 34px;
                color: #888;
                font-weight: 600;
                font-variant-numeric: tabular-nums;
            }
            .toc-t {
                flex: 1;
            }
            .toc-arrow {
                color: #999;
                font-size: 11px;
                opacity: 0;
                transition: opacity 0.12s;
            }
            .toc-sec:hover .toc-arrow {
                opacity: 1;
            }

            /* STATUTE TITLE */
            .st-title-block {
                text-align: center;
                margin-bottom: 32px;
                padding-bottom: 22px;
                border-bottom: 2px solid #111;
            }
            .st-title {
                font-size: 21px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                line-height: 1.35;
                color: #111;
            }
            .st-cap {
                font-size: 16px;
                font-weight: 700;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: #333;
                margin-top: 10px;
            }
            .st-meta {
                margin-top: 18px;
                font-size: 12px;
                color: #555;
                line-height: 1.75;
                font-family: -apple-system, sans-serif;
            }
            .st-meta-line {
                margin: 2px 0;
            }
            .st-meta-line strong {
                color: #222;
                font-weight: 600;
            }
            .st-preamble {
                font-style: italic;
                font-size: 14.5px;
                color: #333;
                background: #fafafa;
                padding: 16px 24px;
                border-radius: 6px;
                border-left: 3px solid #888;
                margin: 0 0 32px;
                line-height: 1.8;
            }

            /* STATUTE PARTS & SECTIONS */
            .st-part-head {
                text-align: center;
                margin: 44px 0 24px;
                padding: 14px 0;
                border-top: 2px solid #111;
                border-bottom: 2px solid #111;
            }
            .st-part-num {
                display: block;
                font-size: 14px;
                font-weight: 700;
                letter-spacing: 0.22em;
                text-transform: uppercase;
                color: #111;
            }
            .st-part-title {
                display: block;
                font-size: 14px;
                font-weight: 600;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                margin-top: 6px;
                color: #333;
            }
            .st-sec {
                margin: 28px 0;
                scroll-margin-top: 72px;
            }
            .st-sec-head {
                display: flex;
                gap: 10px;
                align-items: baseline;
                margin-bottom: 12px;
            }
            .st-sec-num {
                flex-shrink: 0;
                font-weight: 700;
                font-size: 16px;
                color: #111;
                font-variant-numeric: tabular-nums;
            }
            .st-sec-title {
                font-weight: 700;
                font-size: 15px;
                color: #111;
                line-height: 1.5;
            }

            .st-sub {
                margin: 10px 0;
                line-height: 1.75;
                text-align: justify;
            }
            .st-sub.l0 {
                padding-left: 0;
            }
            .st-sub.l1 {
                display: flex;
                gap: 8px;
                padding-left: 28px;
            }
            .st-sub.l2 {
                display: flex;
                gap: 8px;
                padding-left: 56px;
            }
            .st-sub.l3 {
                display: flex;
                gap: 8px;
                padding-left: 84px;
            }
            .st-mk {
                flex: 0 0 42px;
                font-weight: 600;
                color: #222;
            }
            .st-tx {
                flex: 1;
                min-width: 0;
            }
            .st-text {
                margin: 14px 0;
                text-align: justify;
                line-height: 1.75;
            }
            .st-raw pre {
                white-space: pre-wrap;
                font-family: Georgia, serif;
                font-size: 15px;
                line-height: 1.8;
                color: #222;
            }

            /* PDF FALLBACK */
            .pdfbox {
                text-align: center;
                padding: 44px 24px;
                border: 1px dashed #ccc;
                border-radius: 8px;
                background: #fafafa;
                margin: 24px 0;
            }
            .pdfbox p {
                color: #666;
                font-size: 14px;
                margin-bottom: 16px;
                line-height: 1.6;
            }
            .pdfbox a {
                display: inline-block;
                padding: 10px 22px;
                background: #111;
                color: #fff;
                border-radius: 8px;
                font-size: 13px;
                font-weight: 600;
            }

            /* NAVIGATION */
            .nav {
                display: flex;
                justify-content: space-between;
                gap: 12px;
                margin-top: 44px;
                padding-top: 24px;
                border-top: 1px solid #eee;
            }
            .nav a,
            .nav button {
                padding: 8px 16px;
                border: 1px solid #ddd;
                border-radius: 8px;
                font-size: 13px;
                background: #fff;
                color: #333;
                cursor: pointer;
                font-family: -apple-system, sans-serif;
            }
            .nav a:hover,
            .nav button:hover {
                background: #f5f5f5;
            }

            /* SECTION PICKER */
            .section-picker {
                margin-top: 20px;
                position: relative;
                font-family: -apple-system, sans-serif;
            }
            .section-trigger {
                width: 100%;
                padding: 12px 18px;
                background: #fff;
                border: 1px solid #ddd;
                border-radius: 8px;
                font-size: 14px;
                color: #333;
                text-align: left;
                display: flex;
                align-items: center;
                gap: 10px;
                cursor: pointer;
                font-family: inherit;
                transition: all 0.12s;
            }
            .section-trigger:hover {
                background: #f9f9f9;
                border-color: #bbb;
            }
            .picker-current {
                font-weight: 700;
                color: #111;
                font-variant-numeric: tabular-nums;
            }
            .picker-label {
                color: #888;
                font-size: 12px;
                letter-spacing: 0.04em;
                text-transform: uppercase;
            }
            .picker-arrow {
                margin-left: auto;
                font-size: 11px;
                color: #888;
                transition: transform 0.15s;
            }
            .section-picker.open .picker-arrow {
                transform: rotate(180deg);
            }
            .section-dropdown {
                display: none;
                position: absolute;
                bottom: 100%;
                left: 0;
                right: 0;
                margin-bottom: 6px;
                background: #fff;
                border: 1px solid #ddd;
                border-radius: 8px;
                box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.08);
                max-height: 420px;
                overflow-y: auto;
                z-index: 30;
                font-family: -apple-system, sans-serif;
            }
            .section-picker.open .section-dropdown {
                display: block;
            }
            .dd-part {
                position: sticky;
                top: 0;
                padding: 10px 14px 6px;
                font-size: 11px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.1em;
                color: #888;
                border-bottom: 1px solid #f0f0f0;
                background: #fafafa;
            }
            .dd-item {
                display: flex;
                gap: 10px;
                padding: 8px 14px;
                font-size: 13px;
                color: #333;
                border-bottom: 1px solid #f5f5f5;
                line-height: 1.5;
            }
            .dd-item:last-child {
                border-bottom: none;
            }
            .dd-item:hover {
                background: #f6f6f6;
            }
            .dd-item.active {
                background: #eff6ff;
                color: #1e40af;
                font-weight: 600;
            }
            .dd-num {
                min-width: 34px;
                color: #888;
                font-weight: 600;
                flex-shrink: 0;
                font-variant-numeric: tabular-nums;
            }
            .dd-item.active .dd-num {
                color: #1e40af;
            }
            .dd-title {
                flex: 1;
            }

            /* CONSTITUTION */
            .co-ch {
                border-bottom: 2px solid #111;
                padding-bottom: 18px;
                margin-bottom: 30px;
                text-align: center;
            }
            .co-ch small {
                font-size: 11px;
                letter-spacing: 0.15em;
                text-transform: uppercase;
                color: #888;
                font-weight: 600;
            }
            .co-ch h2 {
                font-size: 19px;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                margin-top: 6px;
            }
            .co-art {
                text-align: center;
                margin-bottom: 22px;
            }
            .co-art h3 {
                font-size: 17px;
                line-height: 1.45;
            }
            .co-para {
                display: flex;
                gap: 8px;
                margin-bottom: 10px;
                text-align: justify;
                line-height: 1.75;
            }
            .co-para.l1 {
                padding-left: 28px;
            }
            .co-para.l2 {
                padding-left: 56px;
            }
            .co-mk {
                flex: 0 0 38px;
                font-weight: 600;
            }
            .co-tx {
                flex: 1;
                min-width: 0;
            }

            @media (max-width: 720px) {
                .sheet {
                    padding: 28px 20px 44px;
                    font-size: 15px;
                }
                .pnum {
                    flex-basis: 34px;
                }
                .subitem.l1 {
                    margin-left: 20px;
                }
                .subitem.l2 {
                    margin-left: 38px;
                }
                .subitem.l3 {
                    margin-left: 56px;
                }
                .smk {
                    flex-basis: 34px;
                }
                .st-sub.l1 {
                    padding-left: 18px;
                }
                .st-sub.l2 {
                    padding-left: 36px;
                }
                .st-sub.l3 {
                    padding-left: 54px;
                }
                .st-mk {
                    flex-basis: 36px;
                }
                .co-mk {
                    flex-basis: 30px;
                }
                .co-para.l1 {
                    padding-left: 18px;
                }
                .co-para.l2 {
                    padding-left: 36px;
                }
                .toc-panel {
                    padding: 16px 18px;
                }
            }
        </style>
    </head>
    <body>
        <div class="bar">
            <a href="/" class="back">←</a>
            <div class="bar-title" id="barTitle">Document</div>
            <div class="bar-status" id="barStatus">Loading</div>
        </div>
        <div class="wrap">
            <div class="sheet" id="sheet">
                <div class="loading"><span class="spinner"></span>Loading…</div>
            </div>
        </div>

        <script>
            (() => {
                "use strict";

                const isLocal =
                    ["localhost", "127.0.0.1", ""].includes(
                        location.hostname,
                    ) || location.protocol === "file:";
                const API = isLocal ? "" : "https://lawdesk.onrender.com";

                const params = new URLSearchParams(location.search);
                const mode = (params.get("mode") || "").toLowerCase();
                const sourceUrl =
                    params.get("sourceUrl") || params.get("url") || "";
                const article = params.get("article");
                const section = params.get("section");
                const titleParam = params.get("title") || "";

                const $ = (id) => document.getElementById(id);
                const sheet = $("sheet"),
                    barTitle = $("barTitle"),
                    barStatus = $("barStatus");

                const esc = (s) =>
                    String(s ?? "").replace(
                        /[&<>"']/g,
                        (c) =>
                            ({
                                "&": "&amp;",
                                "<": "&lt;",
                                ">": "&gt;",
                                '"': "&quot;",
                                "'": "&#39;",
                            })[c],
                    );

                const loading = (msg) => {
                    sheet.innerHTML = `<div class="loading"><span class="spinner"></span>${esc(msg)}</div>`;
                };
                const fail = (msg) => {
                    sheet.innerHTML = `<div class="error">${esc(msg)}</div>`;
                    barStatus.textContent = "Error";
                };
                const status = (s) => {
                    barStatus.textContent = s;
                };

                function fmt(text) {
                    let out = esc(text);
                    out = out.replace(
                        /\b(v\.|vs\.|supra|ibid|inter alia|prima facie|mutatis mutandis)\b/gi,
                        "<em>$1</em>",
                    );
                    return out;
                }

                function pdfBox(url) {
                    return `<div class="pdfbox">
    <p>This document is available as a PDF only — text could not be extracted.</p>
    <a href="${esc(url)}" target="_blank" rel="noopener">Open PDF</a>
  </div>`;
                }

                /* CONSTITUTION */
                async function loadConstitutionArticle(n) {
                    loading("Loading article…");
                    try {
                        const r = await fetch(
                            `${API}/api/constitution/article/${n}`,
                        );
                        if (!r.ok) throw new Error("Article not found");
                        const a = await r.json();
                        const h = [];
                        if (a.chapter) {
                            h.push(`<div class="co-ch"><small>Chapter ${a.chapter[0]}</small>
        <h2>${esc(a.chapter[1])}</h2></div>`);
                        }
                        if (a.part) {
                            h.push(`<div style="text-align:center;font-size:12px;letter-spacing:.1em;
        text-transform:uppercase;color:#555;font-weight:600;margin-bottom:20px">
        Part ${a.part[0]} — ${esc(a.part[1])}</div>`);
                        }
                        h.push(
                            `<div class="co-art"><h3>${a.number}. ${esc(a.title)}</h3></div>`,
                        );
                        for (const p of a.paragraphs || []) {
                            const lvl = Math.min(p.level || 0, 2);
                            h.push(`<div class="co-para l${lvl}">
        <span class="co-mk">${esc(p.marker || "")}</span>
        <span class="co-tx">${fmt(p.text)}</span>
      </div>`);
                        }
                        const prev = a.number > 1 ? a.number - 1 : null;
                        const next = a.number < 264 ? a.number + 1 : null;
                        h.push(`<div class="nav">
      ${prev ? `<a href="read.html?mode=constitution&article=${prev}">← Article ${prev}</a>` : "<span></span>"}
      ${next ? `<a href="read.html?mode=constitution&article=${next}">Article ${next} →</a>` : "<span></span>"}
    </div>`);
                        sheet.innerHTML = h.join("");
                        barTitle.textContent = `Article ${a.number}. ${a.title}`;
                        status(`Art. ${a.number}`);
                        window.scrollTo(0, 0);
                    } catch (e) {
                        fail(e.message);
                    }
                }

                /* CASE */
                function partyRow(p) {
                    if (!p || !p.name) return "";
                    if (!p.role) {
                        return `<div class="prow"><span class="pname" style="max-width:none">${esc(p.name)}</span></div>`;
                    }
                    return `<div class="prow">
    <span class="pname">${esc(p.name)}</span>
    <span class="leader"></span>
    <span class="prole">${esc(p.role)}</span>
  </div>`;
                }

                function subItemHtml(sub) {
                    const lvl = Math.min(sub.level || 1, 3);
                    return `<div class="subitem l${lvl}">
    <span class="smk">${esc(sub.marker || "")}</span>
    <span class="stx">${fmt(sub.text)}</span>
  </div>`;
                }

                function renderCaseItem(item) {
                    if (item.type === "heading" || item.type === "subheading") {
                        return `<h3 class="body-heading">${esc(item.text)}</h3>`;
                    }
                    if (item.type === "quote") {
                        return `<blockquote class="quote">${fmt(item.text)}</blockquote>`;
                    }
                    if (item.type === "subitem") {
                        return subItemHtml(item);
                    }
                    if (
                        item.type === "para" ||
                        (typeof item.number === "number" && item.number > 0)
                    ) {
                        let h = `<div class="para">
      <span class="pnum">${item.number}</span>
      <div class="ptext">${fmt(item.text)}`;
                        for (const sub of item.items || [])
                            h += subItemHtml(sub);
                        h += `</div></div>`;
                        return h;
                    }
                    return `<p class="plain">${fmt(item.text || "")}</p>`;
                }

                function legacyParties(c) {
                    const out = [];
                    for (const raw of c.parties_before || []) {
                        const m = String(raw).match(/^(.*?)\s*—\s*(.+)$/);
                        out.push(
                            m
                                ? { name: m[1], role: m[2], side: "before" }
                                : {
                                      name: String(raw),
                                      role: "",
                                      side: "before",
                                  },
                        );
                    }
                    for (const raw of c.parties_after || []) {
                        const m = String(raw).match(/^(.*?)\s*—\s*(.+)$/);
                        out.push(
                            m
                                ? { name: m[1], role: m[2], side: "after" }
                                : {
                                      name: String(raw),
                                      role: "",
                                      side: "after",
                                  },
                        );
                    }
                    return out;
                }

                function renderCase(c) {
                    const h = [];

                    h.push('<div class="caption">');
                    if (c.republic)
                        h.push(
                            `<div class="republic">${esc(c.republic)}</div>`,
                        );
                    if (c.court)
                        h.push(`<div class="court">${esc(c.court)}</div>`);
                    if (c.division)
                        h.push(
                            `<div class="division">${esc(c.division)}</div>`,
                        );
                    if (c.case_number)
                        h.push(
                            `<div class="case-no">${esc(c.case_number)}</div>`,
                        );
                    if (c.coram)
                        h.push(`<div class="coram">${esc(c.coram)}</div>`);
                    for (const j of c.judges || [])
                        h.push(`<div class="judge">${esc(j)}</div>`);
                    if (c.date)
                        h.push(`<div class="date">${esc(c.date)}</div>`);
                    h.push("</div>");

                    const parties =
                        c.parties && c.parties.length
                            ? c.parties
                            : legacyParties(c);
                    const before = parties.filter((p) => p.side === "before");
                    const after = parties.filter((p) => p.side !== "before");
                    if (before.length || after.length) {
                        h.push('<div class="parties">');
                        if (!before.length && c.divider) {
                            h.push(
                                `<div class="divider">${esc(c.divider)}</div>`,
                            );
                        }
                        for (const p of before) h.push(partyRow(p));
                        if (before.length && c.divider) {
                            h.push(
                                `<div class="divider">${esc(c.divider)}</div>`,
                            );
                        }
                        for (const p of after) h.push(partyRow(p));
                        h.push("</div>");
                    }

                    /* IN THE MATTER OF … appears after parties, before doc type */
                    if (c.matter)
                        h.push(`<div class="matter-of">${esc(c.matter)}</div>`);
                    if (c.parenthetical)
                        h.push(
                            `<div class="paren">${esc(c.parenthetical)}</div>`,
                        );
                    if (c.doc_type)
                        h.push(`<div class="doctype">${esc(c.doc_type)}</div>`);

                    if (c.pdf_only) {
                        h.push(pdfBox(c.pdf_url || sourceUrl));
                    } else {
                        const paras = c.body || c.paragraphs || [];
                        if (paras.length) {
                            h.push('<div class="case-body">');
                            for (const item of paras)
                                h.push(renderCaseItem(item));
                            h.push("</div>");
                        }
                    }

                    const sig = c.signing_block || c.signing;
                    if (sig && typeof sig === "object") {
                        h.push('<div class="signing">');
                        if (sig.date_line) {
                            h.push(
                                `<div class="sign-date">${esc(sig.date_line)}</div>`,
                            );
                        }
                        for (const s of sig.signatories || []) {
                            if (s.name)
                                h.push(
                                    `<div class="sign-name">${esc(s.name)}</div>`,
                                );
                            if (s.title)
                                h.push(
                                    `<div class="sign-title">${esc(s.title)}</div>`,
                                );
                        }
                        if ((sig.appearances || []).length) {
                            h.push(
                                '<div class="appear-title">In the presence of:</div>',
                            );
                            h.push('<div class="appear-list">');
                            for (const a of sig.appearances) {
                                h.push(
                                    `<div class="appear"><span class="aname">${esc(a.name)}</span>` +
                                        (a.role
                                            ? ` <span class="arole">— ${esc(a.role)}</span>`
                                            : "") +
                                        `</div>`,
                                );
                            }
                            h.push("</div>");
                        }
                        h.push("</div>");
                    } else if (c.signing_raw) {
                        h.push(
                            `<div class="signing raw">${esc(c.signing_raw)}</div>`,
                        );
                    }

                    return h.join("");
                }

                async function loadCase(url) {
                    loading("Loading judgment…");
                    try {
                        const r = await fetch(
                            `${API}/api/case/structured?url=${encodeURIComponent(url)}`,
                        );
                        if (!r.ok) throw new Error("Could not load case");
                        const c = await r.json();
                        sheet.innerHTML = renderCase(c);
                        barTitle.textContent =
                            c.title || titleParam || "Judgment";
                        /* Count all body items (paragraphs, plain text, quotes, subitems) */
                        const total = (c.body || c.paragraphs || []).length;
                        status(`${total} ¶`);
                        window.scrollTo(0, 0);
                    } catch (e) {
                        fail(e.message);
                    }
                }

                /* STATUTE */
                const statuteCache = { url: null, data: null };

                async function getStatute(url) {
                    if (statuteCache.url === url && statuteCache.data)
                        return statuteCache.data;
                    const r = await fetch(
                        `${API}/api/statute/structured?url=${encodeURIComponent(url)}`,
                    );
                    if (!r.ok) throw new Error("Could not load act");
                    statuteCache.data = await r.json();
                    statuteCache.url = url;
                    return statuteCache.data;
                }

                async function resolveStatute(title) {
                    const r = await fetch(
                        `${API}/api/statute/resolve?title=${encodeURIComponent(title)}`,
                    );
                    if (!r.ok) throw new Error("Act not found on EKLR");
                    const d = await r.json();
                    return d.url;
                }

                function statuteBaseUrl(url) {
                    return `read.html?mode=statute&sourceUrl=${encodeURIComponent(url)}`;
                }

                function renderTOCPage(d) {
                    const h = [];
                    const base = statuteBaseUrl(d.url || sourceUrl);

                    h.push('<div class="st-title-block">');
                    h.push(
                        `<div class="st-title">${esc(d.title || "Untitled statute")}</div>`,
                    );
                    if (d.citation)
                        h.push(`<div class="st-cap">${esc(d.citation)}</div>`);
                    const meta = d.metadata || [];
                    if (meta.length) {
                        h.push('<div class="st-meta">');
                        for (const m of meta) {
                            h.push(
                                `<div class="st-meta-line"><strong>${esc(m.label)}</strong> ${esc(m.value)}</div>`,
                            );
                        }
                        h.push("</div>");
                    }
                    h.push("</div>");

                    if (d.preamble)
                        h.push(
                            `<div class="st-preamble">${esc(d.preamble)}</div>`,
                        );

                    const toc = d.toc || [];
                    const hasSections = toc.some(
                        (p) => (p.sections || []).length > 0,
                    );

                    if (!hasSections) {
                        h.push(pdfBox(d.pdf_url || d.url || sourceUrl));
                        return h.join("");
                    }

                    h.push(
                        '<div class="toc-panel"><div class="toc-title">Table of Contents</div>',
                    );
                    for (const part of toc) {
                        if (!(part.sections || []).length) continue;
                        h.push('<div class="toc-part">');
                        if (part.number || part.title) {
                            h.push(
                                `<div class="toc-part-label">${esc(part.number || "")}` +
                                    (part.title
                                        ? ` — ${esc(part.title)}`
                                        : "") +
                                    `</div>`,
                            );
                        }
                        h.push('<div class="toc-secs">');
                        for (const s of part.sections) {
                            h.push(`<a class="toc-sec" href="${base}&section=${encodeURIComponent(s.number)}">
        <span class="toc-n">${esc(s.number)}.</span>
        <span class="toc-t">${esc(s.title)}</span>
        <span class="toc-arrow">→</span>
      </a>`);
                        }
                        h.push("</div></div>");
                    }
                    h.push("</div>");

                    return h.join("");
                }

                function renderSectionPage(
                    d,
                    section,
                    part,
                    allSections,
                    prev,
                    next,
                ) {
                    const h = [];
                    const base = statuteBaseUrl(d.url || sourceUrl);

                    h.push(
                        '<div class="st-title-block" style="margin-bottom:22px;padding-bottom:16px;">',
                    );
                    h.push(`<div class="st-title" style="font-size:15px;letter-spacing:.04em;">
    ${esc(d.title || "")}</div>`);
                    if (d.citation) {
                        h.push(`<div class="st-cap" style="font-size:12px;margin-top:6px;">
      ${esc(d.citation)}</div>`);
                    }
                    h.push("</div>");

                    if (part) {
                        h.push(`<div class="st-part-head">
      <span class="st-part-num">${esc(part.number)}</span>
      ${part.title ? `<span class="st-part-title">${esc(part.title)}</span>` : ""}
    </div>`);
                    }

                    h.push(`<section class="st-sec" id="sec-${esc(section.number)}">
    <h3 class="st-sec-head">
      <span class="st-sec-num">${esc(section.number)}.</span>
      <span class="st-sec-title">${esc(section.title)}</span>
    </h3>`);
                    for (const sub of section.subsections || []) {
                        const lvl = Math.min(sub.level || 0, 3);
                        if (lvl === 0 || !sub.marker) {
                            h.push(`<p class="st-sub l0">${fmt(sub.text)}</p>`);
                        } else {
                            h.push(`<div class="st-sub l${lvl}">
        <span class="st-mk">${esc(sub.marker)}</span>
        <span class="st-tx">${fmt(sub.text)}</span>
      </div>`);
                        }
                    }
                    h.push("</section>");

                    h.push('<div class="nav">');
                    h.push(`<a href="${base}">Contents</a>`);
                    h.push('<div style="display:flex;gap:8px;">');
                    if (prev !== null)
                        h.push(
                            `<a href="${base}&section=${prev}">← ${prev}.</a>`,
                        );
                    if (next !== null)
                        h.push(
                            `<a href="${base}&section=${next}">${next}. →</a>`,
                        );
                    h.push("</div></div>");

                    h.push('<div class="section-picker">');
                    h.push(`<button type="button" class="section-trigger" id="sectionTrigger">
    <span class="picker-label">Go to</span>
    <span class="picker-current">Section ${esc(section.number)}</span>
    <span class="picker-arrow">▴</span>
  </button>`);
                    h.push(
                        '<div class="section-dropdown" id="sectionDropdown">',
                    );

                    const groups = [];
                    let lastPartNum = null;
                    for (const s of allSections) {
                        if (s.part_number !== lastPartNum) {
                            groups.push({
                                label:
                                    (s.part_number
                                        ? s.part_number
                                        : "Sections") +
                                    (s.part_title ? ` — ${s.part_title}` : ""),
                                sections: [],
                            });
                            lastPartNum = s.part_number;
                        }
                        groups[groups.length - 1].sections.push(s);
                    }
                    for (const g of groups) {
                        h.push(`<div class="dd-part">${esc(g.label)}</div>`);
                        for (const s of g.sections) {
                            const isActive =
                                String(s.number) === String(section.number);
                            h.push(`<a class="dd-item${isActive ? " active" : ""}"
        href="${base}&section=${encodeURIComponent(s.number)}">
        <span class="dd-num">${esc(s.number)}.</span>
        <span class="dd-title">${esc(s.title)}</span>
      </a>`);
                        }
                    }
                    h.push("</div></div>");

                    return h.join("");
                }

                async function loadStatuteTOC(url) {
                    loading("Loading act…");
                    try {
                        const d = await getStatute(url);
                        sheet.innerHTML = renderTOCPage(d);
                        barTitle.textContent = d.title || titleParam || "Act";
                        const n = (d.toc || []).reduce(
                            (s, p) => s + (p.sections || []).length,
                            0,
                        );
                        status(`${n} sections`);
                        window.scrollTo(0, 0);
                    } catch (e) {
                        fail(e.message);
                    }
                }

                async function loadStatuteSection(url, n) {
                    loading("Loading section…");
                    try {
                        const d = await getStatute(url);
                        const items = d.items || [];
                        const allSections = [];
                        let part = null,
                            target = null,
                            targetPart = null;
                        for (const it of items) {
                            if (it.type === "part") {
                                part = it;
                            } else if (it.type === "section") {
                                allSections.push({
                                    number: it.number,
                                    title: it.title,
                                    part_number: part ? part.number : "",
                                    part_title: part ? part.title : "",
                                });
                                if (String(it.number) === String(n)) {
                                    target = it;
                                    targetPart = part;
                                }
                            }
                        }
                        if (!target) return fail(`Section ${n} not found`);

                        const idx = allSections.findIndex(
                            (s) => String(s.number) === String(n),
                        );
                        const prev =
                            idx > 0 ? allSections[idx - 1].number : null;
                        const next =
                            idx < allSections.length - 1
                                ? allSections[idx + 1].number
                                : null;

                        sheet.innerHTML = renderSectionPage(
                            d,
                            target,
                            targetPart,
                            allSections,
                            prev,
                            next,
                        );
                        barTitle.textContent = d.title || titleParam || "Act";
                        status(`Section ${target.number}`);
                        window.scrollTo(0, 0);

                        const picker =
                            document.querySelector(".section-picker");
                        const trigger =
                            document.getElementById("sectionTrigger");
                        if (picker && trigger) {
                            trigger.addEventListener("click", (e) => {
                                e.stopPropagation();
                                picker.classList.toggle("open");
                            });
                            document.addEventListener("click", (e) => {
                                if (!e.target.closest(".section-picker")) {
                                    picker.classList.remove("open");
                                }
                            });
                        }
                    } catch (e) {
                        fail(e.message);
                    }
                }

                /* ROUTER */
                (async () => {
                    try {
                        if (mode === "constitution") {
                            if (!article) {
                                location.replace("/");
                                return;
                            }
                            return await loadConstitutionArticle(article);
                        }
                        if (mode === "case") {
                            if (!sourceUrl)
                                return fail("No case URL provided.");
                            return await loadCase(sourceUrl);
                        }
                        if (mode === "statute") {
                            let url = sourceUrl;
                            if (!url && titleParam) {
                                loading("Resolving act…");
                                url = await resolveStatute(titleParam);
                            }
                            if (!url) return fail("No act specified.");
                            if (section)
                                return await loadStatuteSection(url, section);
                            return await loadStatuteTOC(url);
                        }
                        fail("No document specified.");
                    } catch (e) {
                        fail(e.message || "Failed to load document.");
                    }
                })();
            })();
        </script>
    </body>
</html>
